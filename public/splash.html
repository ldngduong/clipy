<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Clipy</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #1c1c1e;
        color: #fafafa;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
      }
      .wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }
      .name {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      .spinner {
        width: 20px;
        height: 20px;
        border: 2px solid rgba(255, 255, 255, 0.15);
        border-top-color: #fafafa;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-color-scheme: light) {
        body {
          background: #f5f5f7;
          color: #1c1c1e;
        }
        .spinner {
          border: 2px solid rgba(0, 0, 0, 0.12);
          border-top-color: #1c1c1e;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="name">Clipy</div>
      <div class="spinner"></div>
    </div>
  </body>
</html>
